# Entorno de desarrollo: Node 22 (igual que el CI) + Postgres 16 local.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ..:/workspaces/cordoba-digital:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/cordoba
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on: [db]
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cordoba
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
