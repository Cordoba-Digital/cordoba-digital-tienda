name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `next build` importa src/db al juntar datos de las rutas y exige la
      # variable, pero no se conecta: alcanza con una URL de mentira.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  migraciones:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Un cambio en src/db/schema.ts tiene que venir con su migración.
      - name: Schema y migraciones en sincronía
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts cambió sin migración. Correr npm run db:generate y commitear drizzle/."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Las migraciones corren sobre una base vacía
        run: npm run db:migrate && npm run db:migrate
      # Checkout, webhook de Mercado Pago y permisos del panel contra la base recién migrada.
      - name: Tests de API
        run: npm run test:api
      # Una compra de punta a punta en Chromium contra el build y la misma base.
      - name: Build para la prueba de compra
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Prueba de compra en el navegador
        run: npm run test:e2e
