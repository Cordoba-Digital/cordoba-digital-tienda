name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `next build` importa src/db al juntar datos de las rutas y exige la
      # variable, pero no se conecta: alcanza con una URL de mentira.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:checkout
      - run: npm run test:guias
      - run: npm run build
